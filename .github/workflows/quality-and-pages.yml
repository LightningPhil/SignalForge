name: Quality and GitHub Pages

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

concurrency:
  group: signalforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality:
    name: Check, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run static and unit checks
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Verify tracked production bundle
        run: npm run verify:dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke-test deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out smoke test
        uses: actions/checkout@v5

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify published HTML and assets
        shell: bash
        run: |
          for attempt in {1..12}; do
            node scripts/smoke-pages.mjs "${{ needs.deploy.outputs.page_url }}" && exit 0
            sleep 10
          done
          exit 1
